<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - My Task Manager</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 30px 15px;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #00000010;
    }

    h1 {
      color: #2563eb;
      text-align: center;
    }

    p {
      text-align: center;
      color: #64748b;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      color: #15803d;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TaskFlow 🚀</h1>
    <p>Your personal task manager</p>

    <input
      type="text"
      id="taskInput"
      placeholder="Enter your task"
    >

    <button onclick="addTask()">Add Task</button>

    <p id="message">Welcome to TaskFlow!</p>
  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const message = document.getElementById("message");

      if (input.value.trim() === "") {
        message.textContent = "Please enter a task.";
        return;
      }

      message.textContent = "Task received: " + input.value;
      input.value = "";
    }
  </script>
</body>
</html>
